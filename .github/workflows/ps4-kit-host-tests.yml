name: ps4-kit host compatibility tests

on:
  push:
    branches:
      - research/ps4-kit-reconstruction
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linker-and-cmake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev
      - name: Syntax-check the reconstructed Wine window WSI against Vulkan-Headers
        run: c++ -std=c++20 -Wall -Wextra -fsyntax-only -Ips4-kit/include ps4-kit/mesa/ps4_vk_wsi_window.cpp
      - name: Exercise WSI dispatch forwarding with a fake RADV ICD
        run: |
          c++ -std=c++20 -Ips4-kit/include ps4-kit/mesa/ps4_vk_wsi_window.cpp ps4-kit/mesa/tests/test_wsi_dispatch.cpp -o /tmp/ps4-kit-wsi-dispatch
          /tmp/ps4-kit-wsi-dispatch
      - name: Test Mesa build driver syntax and help
        run: bash ps4-kit/scripts/tests/test_build_mesa.sh
      - name: Test guarded Mesa GNM source staging
        run: bash ps4-kit/mesa/tests/test_prepare_source.sh
      - name: Test linker-script generator and CMake glue
        run: python3 -m unittest discover -s toolchain/ps4-kit-compat/tests -v
      - name: Configure MGR and MP3 project-injection hooks
        run: bash ps4-kit/tests/test-project-injection.sh
      - name: Check both helper orders and separate WSI profiles
        run: bash ps4-kit/tests/test-wsi-profiles.sh
      - name: Check exported diagnostics data-directory function
        run: bash ps4-kit/tests/test-diag-data-dir.sh
      - name: Compile and test diagnostics thread registry and watchdog dump
        run: bash ps4-kit/runtime/tests/run-diag-runtime-tests.sh

  environment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
      - name: Test OpenOrbis environment bootstrap with fake SDK tools
        run: bash ps4-kit/toolchain/tests/test-env.sh

  package-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
      - name: Test package script with fake OpenOrbis tools
        run: bash ps4-kit/scripts/tests/test_make_pkg.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
      - name: Test runtime wrappers with mocked PS4 imports
        run: bash ps4-kit/runtime/tests/run-host-tests.sh
      - name: Test deterministic Wine heap policy planner
        run: bash ps4-kit/runtime/tests/run-heap-policy-tests.sh

  mesa-upstream-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
      - name: Fetch the exact public Mesa 26.0.8 tag
        run: git clone --depth 1 --branch mesa-26.0.8 https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa
      - name: Apply-check the PS4 patch against real upstream Mesa sources
        run: |
          git -C /tmp/mesa rev-parse HEAD
          PS4_MESA_SOURCE=/tmp/mesa bash ps4-kit/mesa/prepare-source.sh
          git -C /tmp/mesa diff --check
          git -C /tmp/mesa status --short

  native-wsi-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host clang and Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libvulkan-dev
      - name: Download OpenOrbis PS4 sysroot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis-toolchain.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis-toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis"
          SDK_HEADER="$(find "$RUNNER_TEMP/openorbis" -path '*/include/orbis/VideoOut.h' -print -quit)"
          test -n "$SDK_HEADER"
          SDK_ROOT="${SDK_HEADER%/include/orbis/VideoOut.h}"
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          CXX_INCLUDE="$(find "$SDK_ROOT" -path '*/include/c++/v1/vector' -print -quit | sed 's#/vector$##')"
          if [ -z "$CXX_INCLUDE" ]; then
            CXX_INCLUDE=/usr/include/c++/v1
          fi
          test -f "$CXX_INCLUDE/vector"
          echo "CXX_INCLUDE=$CXX_INCLUDE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vulkan-headers"
          cp -a /usr/include/vulkan "$RUNNER_TEMP/vulkan-headers/"
      - name: Syntax-check native VideoOut WSI against OpenOrbis headers
        run: |
          clang++ --version
          clang++ -target x86_64-pc-freebsd12-elf -std=c++20 -fsyntax-only \
            -D__PS4__ -nostdinc++ -isysroot "$OO_PS4_TOOLCHAIN" \
            -isystem "$CXX_INCLUDE" -isystem "$OO_PS4_TOOLCHAIN/include" \
            -I "$RUNNER_TEMP/vulkan-headers" -I ps4-kit/include \
            -Wall -Wextra -Wno-unused-parameter \
            ps4-kit/mesa/ps4_vk_wsi_videoout.cpp
