name: ps4-kit project integration

on:
  push:
    branches:
      - research/ps4-kit-reconstruction
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rexglue-project-injection:
    name: MGR and MP3 CMake injection
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconstruction
        uses: actions/checkout@v4

      - name: Check host tools
        run: |
          cmake --version
          python3 --version

      - name: Configure MGR and MP3 project hooks
        run: bash ps4-kit/tests/test-project-injection.sh
